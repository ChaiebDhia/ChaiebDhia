<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">DeepCoin-Core pipeline</title><desc id="d">A coin photo is preprocessed and classified; the CNN confidence routes to Historian above 85 percent, Validator between 40 and 85, and Investigator below 40, all feeding a synthesis report.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141c3a"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0cc"/></marker></defs><style>text{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}@keyframes d{to{stroke-dashoffset:-36}}.f{stroke-dasharray:6 6;animation:d 2.4s linear infinite}</style><rect width="1200" height="456" rx="22" fill="url(#bg)"/><text x="600" y="46" font-size="21" fill="#e6ecff" font-weight="700" text-anchor="middle" >DeepCoin-Core: confidence decides the route, so the system never returns an empty answer</text><rect x="30" y="190" width="140" height="74" rx="14" fill="#121a33" stroke="#22d3ee" stroke-opacity="0.8"/><text x="100.0" y="220" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >Coin photo</text><text x="100.0" y="242" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >one image</text><rect x="210" y="190" width="190" height="74" rx="14" fill="#121a33" stroke="#22d3ee" stroke-opacity="0.8"/><text x="305.0" y="220" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >Preprocess</text><text x="305.0" y="242" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >crop · CLAHE · 299 px</text><rect x="440" y="190" width="210" height="74" rx="14" fill="#121a33" stroke="#8b5cf6" stroke-opacity="0.8"/><text x="545.0" y="220" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >EfficientNet-B3</text><text x="545.0" y="242" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >438 classes · Grad-CAM++</text><path class="f" d="M170 227 C190.0 227 190.0 227 210 227" fill="none" stroke="#8fa0cc" stroke-width="2" marker-end="url(#arr)"/><path class="f" d="M400 227 C420.0 227 420.0 227 440 227" fill="none" stroke="#8fa0cc" stroke-width="2" marker-end="url(#arr)"/><path class="f" d="M650 227 C710.0 227 710.0 123 770 123" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/><rect x="770" y="86" width="260" height="74" rx="14" fill="#121a33" stroke="#22c55e" stroke-opacity="0.8"/><text x="900.0" y="116" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >Historian</text><text x="900.0" y="138" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >hybrid RAG + cited LLM report</text><path class="f" d="M1030 123 C1049.0 123 1049.0 227 1068 227" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/><path class="f" d="M650 227 C710.0 227 710.0 227 770 227" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/><rect x="770" y="190" width="260" height="74" rx="14" fill="#121a33" stroke="#f59e0b" stroke-opacity="0.8"/><text x="900.0" y="220" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >Validator</text><text x="900.0" y="242" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >multi-scale HSV metal check</text><path class="f" d="M1030 227 C1049.0 227 1049.0 227 1068 227" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/><path class="f" d="M650 227 C710.0 227 710.0 331 770 331" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arr)"/><rect x="770" y="294" width="260" height="74" rx="14" fill="#121a33" stroke="#f87171" stroke-opacity="0.8"/><text x="900.0" y="324" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >Investigator</text><text x="900.0" y="346" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >VLM + OpenCV, nearest known types</text><path class="f" d="M1030 331 C1049.0 331 1049.0 227 1068 227" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arr)"/><rect x="685.5" y="131" width="53" height="22" rx="11" fill="#0b1020" stroke="#22c55e"/><text x="712" y="146.5" font-size="12.5" fill="#22c55e" font-weight="700" text-anchor="middle" >&gt; 85%</text><rect x="674.5" y="233" width="75" height="22" rx="11" fill="#0b1020" stroke="#f59e0b"/><text x="712" y="248.5" font-size="12.5" fill="#f59e0b" font-weight="700" text-anchor="middle" >40 – 85%</text><rect x="685.5" y="327" width="53" height="22" rx="11" fill="#0b1020" stroke="#f87171"/><text x="712" y="342.5" font-size="12.5" fill="#f87171" font-weight="700" text-anchor="middle" >&lt; 40%</text><rect x="1068" y="190" width="112" height="74" rx="14" fill="#121a33" stroke="#22d3ee" stroke-opacity="0.8"/><text x="1124.0" y="220" font-size="15.5" fill="#e6ecff" font-weight="700" text-anchor="middle" >Synthesis</text><text x="1124.0" y="242" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="middle" >PDF + heatmap</text><text x="600" y="406" font-size="14" fill="#8fa0cc" font-weight="400" text-anchor="middle" >Retrieval is grounded in a 47,705-vector knowledge base (BM25 + ChromaDB + rank fusion); structured facts are copied from it, not generated.</text><text x="600" y="430" font-size="14" fill="#8fa0cc" font-weight="400" text-anchor="middle" >Runs locally on a 4 GB GPU with Ollama; paid APIs are optional.</text></svg>