<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="How I work: scope, build the slice, measure, ship, iterate">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0f2250"/></linearGradient>
<linearGradient id="ac2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<clipPath id="r2"><rect width="1200" height="300" rx="18"/></clipPath></defs>
<g clip-path="url(#r2)" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<rect width="1200" height="300" fill="url(#bg2)"/>
<text x="48" y="54" font-size="22" font-weight="700" fill="#93c5fd" letter-spacing="3">HOW I WORK ON APPLIED AND FORWARD-DEPLOYED AI</text>
<line x1="150" y1="120" x2="1050" y2="120" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="2"/>
<circle r="6" fill="#22d3ee"><animateMotion dur="8s" repeatCount="indefinite" path="M150,120 L1050,120"/></circle>
<circle cx="150" cy="120" r="26" fill="#0b1530" stroke="#60a5fa" stroke-width="2"/><text x="150" y="128" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">1</text>
<text x="150" y="185" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">Scope</text>
<text x="150" y="215" font-size="17" fill="#94a3b8" text-anchor="middle">Find the real constraint:</text>
<text x="150" y="239" font-size="17" fill="#94a3b8" text-anchor="middle">users, data, latency, budget</text>
<circle cx="375" cy="120" r="26" fill="#0b1530" stroke="#60a5fa" stroke-width="2"/><text x="375" y="128" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">2</text>
<text x="375" y="185" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">Build the slice</text>
<text x="375" y="215" font-size="17" fill="#94a3b8" text-anchor="middle">Thinnest working path:</text>
<text x="375" y="239" font-size="17" fill="#94a3b8" text-anchor="middle">model to API to UI</text>
<circle cx="600" cy="120" r="26" fill="#0b1530" stroke="#60a5fa" stroke-width="2"/><text x="600" y="128" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">3</text>
<text x="600" y="185" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">Measure</text>
<text x="600" y="215" font-size="17" fill="#94a3b8" text-anchor="middle">Held-out data, honest limits,</text>
<text x="600" y="239" font-size="17" fill="#94a3b8" text-anchor="middle">corrections published</text>
<circle cx="825" cy="120" r="26" fill="#0b1530" stroke="#60a5fa" stroke-width="2"/><text x="825" y="128" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">4</text>
<text x="825" y="185" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">Ship</text>
<text x="825" y="215" font-size="17" fill="#94a3b8" text-anchor="middle">Tests, CI/CD, Docker,</text>
<text x="825" y="239" font-size="17" fill="#94a3b8" text-anchor="middle">Prometheus + Grafana</text>
<circle cx="1050" cy="120" r="26" fill="#0b1530" stroke="#60a5fa" stroke-width="2"/><text x="1050" y="128" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">5</text>
<text x="1050" y="185" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">Iterate</text>
<text x="1050" y="215" font-size="17" fill="#94a3b8" text-anchor="middle">Expert feedback loops back</text>
<text x="1050" y="239" font-size="17" fill="#94a3b8" text-anchor="middle">into retraining</text>
</g></svg>