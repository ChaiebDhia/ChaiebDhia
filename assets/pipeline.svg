<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">DeepCoin-Core pipeline</title><desc id="d">Photo, preprocessing, EfficientNet-B3, confidence router to Historian, Validator or Investigator, then a sourced PDF report.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1A"/><stop offset="1" stop-color="#101A2E"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#7CC4FF"/><stop offset="1" stop-color="#4ADE9F"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17233A" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7399"/></marker>

</defs>
<rect width="1280" height="470" rx="18" fill="url(#bg)"/>
<rect width="1280" height="470" rx="18" fill="url(#grid)" opacity=".5"/>
<rect x="40" y="165" width="110" height="90" rx="14" fill="#0F1829" stroke="#7CC4FF" stroke-width="1"/>
<text x="56" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Coin photo</text>
<text x="56" y="221" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">one image in</text>
<rect x="175" y="165" width="150" height="90" rx="14" fill="#0F1829" stroke="#7CC4FF" stroke-width="1"/>
<text x="191" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Preprocess</text>
<text x="191" y="221" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">Hough crop and CLAHE</text>
<rect x="350" y="165" width="200" height="90" rx="14" fill="#0F1829" stroke="#7CC4FF" stroke-width="1"/>
<text x="366" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">EfficientNet-B3</text>
<text x="366" y="221" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">438 classes, Grad-CAM++</text>
<text x="366" y="237" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">heatmap at 19 x 19</text>
<rect x="580" y="165" width="130" height="90" rx="14" fill="#0F1829" stroke="#F2B84B" stroke-width="1"/>
<text x="596" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Router</text>
<text x="596" y="221" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">CNN confidence</text>
<text x="596" y="237" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">picks the path</text>
<line x1="150" y1="210" x2="173" y2="210" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<line x1="325" y1="210" x2="348" y2="210" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<line x1="550" y1="210" x2="578" y2="210" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<rect x="760" y="40" width="270" height="100" rx="14" fill="#0F1829" stroke="#4ADE9F" stroke-width="1"/>
<text x="776" y="70" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Historian</text>
<text x="1014" y="70" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#4ADE9F" text-anchor="end" letter-spacing="0">above 85%</text>
<text x="776" y="94" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">Hybrid RAG fetches cited facts, the</text>
<text x="776" y="110" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">LLM writes only from them.</text>
<path d="M710 210 H735 V90 H758" fill="none" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1030 90 H1050 V210 H1068" fill="none" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<rect x="760" y="160" width="270" height="100" rx="14" fill="#0F1829" stroke="#F2B84B" stroke-width="1"/>
<text x="776" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Validator</text>
<text x="1014" y="190" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#F2B84B" text-anchor="end" letter-spacing="0">40 to 85%</text>
<text x="776" y="214" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">Multi-scale HSV metal check, agreed</text>
<text x="776" y="230" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">against the knowledge base.</text>
<path d="M710 210 H735 V210 H758" fill="none" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1030 210 H1050 V210 H1068" fill="none" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<rect x="760" y="280" width="270" height="100" rx="14" fill="#0F1829" stroke="#7CC4FF" stroke-width="1"/>
<text x="776" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Investigator</text>
<text x="1014" y="310" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#7CC4FF" text-anchor="end" letter-spacing="0">below 40%</text>
<text x="776" y="334" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">Vision LLM plus the nearest</text>
<text x="776" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">knowledge-base types.</text>
<path d="M710 210 H735 V330 H758" fill="none" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1030 330 H1050 V210 H1068" fill="none" stroke="#5B7399" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1070" y="165" width="170" height="90" rx="14" fill="#0F1829" stroke="#4ADE9F" stroke-width="1"/>
<text x="1086" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">Report</text>
<text x="1086" y="221" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">PDF with heatmap and</text>
<text x="1086" y="237" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">citations</text>
<rect x="40" y="405" width="1200" height="44" rx="10" fill="#0C1424" stroke="#24334F" stroke-width="1"/>
<text x="60" y="432" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#E8EEF8" text-anchor="start" letter-spacing="0">LLM fallback chain: hosted APIs, then local Ollama, then a knowledge-base-only report. The pipeline never returns an empty report.</text>
