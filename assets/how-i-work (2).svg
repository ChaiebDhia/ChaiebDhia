<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">How I work with AI coding tools</title><desc id="d">Six steps: spec and failing test, draft with an assistant, gate it, review the diff, measure on held-out data, publish the numbers.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1A"/><stop offset="1" stop-color="#101A2E"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#7CC4FF"/><stop offset="1" stop-color="#4ADE9F"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17233A" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7399"/></marker>

</defs>
<rect width="1280" height="300" rx="18" fill="url(#bg)"/>
<rect width="1280" height="300" rx="18" fill="url(#grid)" opacity=".5"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#E8EEF8" text-anchor="start" letter-spacing="0">AI-assisted, human-gated</text>
<text x="40" y="78" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9AA9C2" text-anchor="start" letter-spacing="0">The assistant writes fast. The gates decide what ships.</text>
<line x1="120" y1="140" x2="1160" y2="140" stroke="#24334F" stroke-width="2"/>
<circle cx="120" cy="140" r="19" fill="#0A0F1A" stroke="#7CC4FF" stroke-width="2"/>
<text x="120" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#7CC4FF" text-anchor="middle" letter-spacing="0">1</text>
<text x="120" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EEF8" text-anchor="middle" letter-spacing="0">Spec and failing test</text>
<text x="120" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">Write the behaviour I want</text>
<text x="120" y="229" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">as a test before code</text>
<text x="120" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">exists.</text>
<circle cx="328" cy="140" r="19" fill="#0A0F1A" stroke="#7CC4FF" stroke-width="2"/>
<text x="328" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#7CC4FF" text-anchor="middle" letter-spacing="0">2</text>
<text x="328" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EEF8" text-anchor="middle" letter-spacing="0">Draft with an assistant</text>
<text x="328" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">Claude Code drafts. I own</text>
<text x="328" y="229" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">the architecture, names and</text>
<text x="328" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">trade-offs.</text>
<circle cx="536" cy="140" r="19" fill="#0A0F1A" stroke="#4ADE9F" stroke-width="2"/>
<text x="536" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#4ADE9F" text-anchor="middle" letter-spacing="0">3</text>
<text x="536" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EEF8" text-anchor="middle" letter-spacing="0">Gate it</text>
<text x="536" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">Lint, types, tests,</text>
<text x="536" y="229" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">sanitizers and scans must</text>
<text x="536" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">pass in CI.</text>
<circle cx="744" cy="140" r="19" fill="#0A0F1A" stroke="#7CC4FF" stroke-width="2"/>
<text x="744" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#7CC4FF" text-anchor="middle" letter-spacing="0">4</text>
<text x="744" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EEF8" text-anchor="middle" letter-spacing="0">Review the diff</text>
<text x="744" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">I read every change.</text>
<text x="744" y="229" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">Nothing merges on trust.</text>
<circle cx="952" cy="140" r="19" fill="#0A0F1A" stroke="#7CC4FF" stroke-width="2"/>
<text x="952" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#7CC4FF" text-anchor="middle" letter-spacing="0">5</text>
<text x="952" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EEF8" text-anchor="middle" letter-spacing="0">Measure held out</text>
<text x="952" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">Score on data the model</text>
<text x="952" y="229" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">never saw. Report</text>
<text x="952" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">intervals, not points.</text>
<circle cx="1160" cy="140" r="19" fill="#0A0F1A" stroke="#F2B84B" stroke-width="2"/>
<text x="1160" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#F2B84B" text-anchor="middle" letter-spacing="0">6</text>
<text x="1160" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EEF8" text-anchor="middle" letter-spacing="0">Publish the numbers</text>
<text x="1160" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">Including corrections. If a</text>
<text x="1160" y="229" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">result does not reproduce,</text>
<text x="1160" y="246" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA9C2" text-anchor="middle" letter-spacing="0">I say so.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
