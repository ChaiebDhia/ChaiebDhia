<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="346" viewBox="0 0 1200 346" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">How I work</title><desc id="d">Scope, measure, explain, ship, audit, and loop back.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141c3a"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0cc"/></marker></defs><style>text{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}@keyframes d{to{stroke-dashoffset:-30}}.f{stroke-dasharray:5 7;animation:d 2.2s linear infinite}</style><rect width="1200" height="346" rx="22" fill="url(#bg)"/><text x="600" y="38" font-size="22" fill="#e6ecff" font-weight="700" text-anchor="middle" >How I work: a loop, not a line</text><line class="f" x1="156" y1="160" x2="322" y2="160" stroke="#8fa0cc" stroke-width="2" marker-end="url(#arr)"/><line class="f" x1="396" y1="160" x2="562" y2="160" stroke="#8fa0cc" stroke-width="2" marker-end="url(#arr)"/><line class="f" x1="636" y1="160" x2="802" y2="160" stroke="#8fa0cc" stroke-width="2" marker-end="url(#arr)"/><line class="f" x1="876" y1="160" x2="1042" y2="160" stroke="#8fa0cc" stroke-width="2" marker-end="url(#arr)"/><path class="f" d="M1080 124 C1080 66 120 66 120 122" fill="none" stroke="#f87171" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arr)"/><text x="600" y="92" font-size="12.5" fill="#f87171" font-weight="600" text-anchor="middle" >the audit feeds the next scope</text><circle cx="120" cy="160" r="34" fill="#121a33" stroke="#22d3ee" stroke-width="3"/><text x="120" y="170" font-size="28" fill="#22d3ee" font-weight="800" text-anchor="middle" >1</text><text x="120" y="222" font-size="18" fill="#e6ecff" font-weight="700" text-anchor="middle" >Scope</text><text x="120" y="244" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >turn a fuzzy problem into</text><text x="120" y="261" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >one measurable question</text><circle cx="360" cy="160" r="34" fill="#121a33" stroke="#8b5cf6" stroke-width="3"/><text x="360" y="170" font-size="28" fill="#8b5cf6" font-weight="800" text-anchor="middle" >2</text><text x="360" y="222" font-size="18" fill="#e6ecff" font-weight="700" text-anchor="middle" >Measure</text><text x="360" y="244" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >held-out sets,</text><text x="360" y="261" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >calibration, bootstrap</text><text x="360" y="278" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >error bars</text><circle cx="600" cy="160" r="34" fill="#121a33" stroke="#22c55e" stroke-width="3"/><text x="600" y="170" font-size="28" fill="#22c55e" font-weight="800" text-anchor="middle" >3</text><text x="600" y="222" font-size="18" fill="#e6ecff" font-weight="700" text-anchor="middle" >Explain</text><text x="600" y="244" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >Grad-CAM++, residuals,</text><text x="600" y="261" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >per-group coverage</text><circle cx="840" cy="160" r="34" fill="#121a33" stroke="#f59e0b" stroke-width="3"/><text x="840" y="170" font-size="28" fill="#f59e0b" font-weight="800" text-anchor="middle" >4</text><text x="840" y="222" font-size="18" fill="#e6ecff" font-weight="700" text-anchor="middle" >Ship</text><text x="840" y="244" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >tests, CI, Docker,</text><text x="840" y="261" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >monitoring</text><circle cx="1080" cy="160" r="34" fill="#121a33" stroke="#f87171" stroke-width="3"/><text x="1080" y="170" font-size="28" fill="#f87171" font-weight="800" text-anchor="middle" >5</text><text x="1080" y="222" font-size="18" fill="#e6ecff" font-weight="700" text-anchor="middle" >Audit</text><text x="1080" y="244" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >re-run it, correct my own</text><text x="1080" y="261" font-size="12.5" fill="#8fa0cc" font-weight="400" text-anchor="middle" >numbers in public</text><text x="600" y="318" font-size="14" fill="#c7d2fe" font-weight="500" text-anchor="middle" >Example: I re-ran DeepCoin's evaluation, found the headline did not reproduce, and published the correction.</text></svg>