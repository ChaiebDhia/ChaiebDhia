<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Two tracks of work</title><desc id="d">DeepCoin-Core for AI systems and f1lap for validated uncertainty, each with headline numbers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141c3a"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0cc"/></marker></defs><style>text{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}</style><rect width="1200" height="360" rx="22" fill="url(#bg)"/><text x="600" y="52" font-size="22" fill="#e6ecff" font-weight="700" text-anchor="middle" >Two ways I work: ship the system, and quantify what the model does not know</text><rect x="50" y="86" width="520" height="250" rx="18" fill="#121a33" stroke="#24305a"/><rect x="78" y="102" width="64" height="4" rx="2" fill="#22d3ee"/><text x="78" y="130" font-size="13" fill="#22d3ee" font-weight="700" text-anchor="start" letter-spacing="2.5" >AI SYSTEMS</text><text x="78" y="166" font-size="30" fill="#e6ecff" font-weight="800" text-anchor="start" >DeepCoin-Core</text><text x="78" y="194" font-size="15" fill="#8fa0cc" font-weight="400" text-anchor="start" >Photo in, sourced and explainable report out.</text><text x="78" y="262" font-size="30" fill="#22d3ee" font-weight="800" text-anchor="start" >438</text><text x="78" y="288" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="start" >fine-grained classes</text><text x="248" y="262" font-size="30" fill="#22d3ee" font-weight="800" text-anchor="start" >47,705</text><text x="248" y="288" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="start" >vectors, hybrid RAG</text><text x="418" y="262" font-size="30" fill="#22d3ee" font-weight="800" text-anchor="start" >133</text><text x="418" y="288" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="start" >tests, CI/CD, 11 services</text><rect x="630" y="86" width="520" height="250" rx="18" fill="#121a33" stroke="#24305a"/><rect x="658" y="102" width="64" height="4" rx="2" fill="#8b5cf6"/><text x="658" y="130" font-size="13" fill="#8b5cf6" font-weight="700" text-anchor="start" letter-spacing="2.5" >MODELLING &amp; UNCERTAINTY</text><text x="658" y="166" font-size="30" fill="#e6ecff" font-weight="800" text-anchor="start" >f1lap</text><text x="658" y="194" font-size="15" fill="#8fa0cc" font-weight="400" text-anchor="start" >Physics-structured lap-time forecasts, honestly scored.</text><text x="658" y="262" font-size="30" fill="#8b5cf6" font-weight="800" text-anchor="start" >0.53 s</text><text x="658" y="288" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="start" >late-stint RMSE</text><text x="828" y="262" font-size="30" fill="#8b5cf6" font-weight="800" text-anchor="start" >87%</text><text x="828" y="288" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="start" >laps inside 90% band</text><text x="998" y="262" font-size="30" fill="#8b5cf6" font-weight="800" text-anchor="start" >37</text><text x="998" y="288" font-size="12" fill="#8fa0cc" font-weight="400" text-anchor="start" >tests, CI, Docker</text></svg>